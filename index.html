<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Колесо Слов</title>
    <style>
        /* Базовые стили */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start; /* Изменено на flex-start для лучшего размещения при большом количестве полей */
            min-height: 100vh;
            padding-top: 50px;
            margin: 0;
            background-color: #e9eef2;
        }

        .container {
            background: #fff;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 100%;
            max-width: 450px;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 25px;
        }

        /* ---------------- Динамические поля ввода ---------------- */
        
        #input-container {
            max-height: 300px; /* Ограничиваем высоту для скролла, если полей много */
            overflow-y: auto;
            margin-bottom: 15px;
            padding: 5px;
        }

        .word-field {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
        }

        .word-field input {
            flex-grow: 1;
            padding: 10px;
            border: 2px solid #bdc3c7;
            border-radius: 6px;
            font-size: 1em;
            transition: border-color 0.3s;
        }
        
        .word-field input:focus {
            border-color: #3498db;
            outline: none;
        }

        .remove-btn {
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 0.9em;
        }

        /* Кнопки управления */
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .action-btn {
            padding: 10px 20px;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        #add-input-btn {
            background-color: #2ecc71;
        }
        #add-input-btn:hover {
            background-color: #27ae60;
        }

        #spin-button {
            width: 100%;
            padding: 15px 30px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.3em;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        #spin-button:hover:not(:disabled) {
            background-color: #2980b9;
        }

        #spin-button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        /* ---------------- Модальные окна ---------------- */

        .modal {
            display: none; 
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: #fff;
            padding: 50px;
            border-radius: 10px;
            text-align: center;
            position: relative;
            max-width: 90%;
            min-width: 350px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* Стиль для колеса (имитация) */
        #wheel {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 15px solid #f39c12;
            background: conic-gradient(
                #f1c40f 0deg 36deg,
                #e67e22 36deg 72deg,
                #e74c3c 72deg 108deg,
                #9b59b6 108deg 144deg,
                #3498db 144deg 180deg,
                #2ecc71 180deg 216deg,
                #1abc9c 216deg 252deg,
                #f1c40f 252deg 288deg,
                #e67e22 288deg 324deg,
                #e74c3c 324deg 360deg
            );
            margin: 30px auto;
            position: relative;
        }
        
        /* Стрелка-указатель */
        #wheel::before {
            content: '▼';
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 30px;
            color: #c0392b;
        }
        
        /* Анимация вращения */
        .spinning {
            animation: spin 2s cubic-bezier(0.6, 0.05, 0.3, 1) infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Стиль для результата */
        #result-display {
            font-size: 2.5em;
            font-weight: bold;
            color: #27ae60;
            margin-top: 20px;
            word-break: break-word; /* Чтобы длинные слова помещались */
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Колесо Слов</h1>

        <div id="input-container">
            </div>
        
        <p id="error-message" style="color: #e74c3c; height: 20px; font-weight: 500;"></p>

        <div class="controls">
            <button id="add-input-btn" class="action-btn" disabled>+ Добавить Поле (Макс. 10)</button>
        </div>

        <button id="spin-button" disabled>Крутить</button>
    </div>

    <div id="wheel-modal" class="modal">
        <div class="modal-content">
            <h2>Колесо Слов крутится...</h2>
            <div id="wheel"></div>
            <p>Ваше слово скоро будет выбрано!</p>
        </div>
    </div>

    <div id="result-modal" class="modal">
        <div class="modal-content">
            <h2>Выпавшее Слово:</h2>
            <div id="result-display">...</div>
            <button id="close-result-btn" class="action-btn" style="background-color: #3498db; margin-top: 25px;">Снова Крутить</button>
        </div>
    </div>

    <script>
        const MAX_FIELDS = 10;
        const inputContainer = document.getElementById('input-container');
        const spinButton = document.getElementById('spin-button');
        const addInputBtn = document.getElementById('add-input-btn');
        const errorMessage = document.getElementById('error-message');
        const wheelModal = document.getElementById('wheel-modal');
        const resultModal = document.getElementById('result-modal');
        const resultDisplay = document.getElementById('result-display');
        const wheelElement = document.getElementById('wheel');
        const closeResultBtn = document.getElementById('close-result-btn');

        let fieldCount = 0;

        // 1. Функция для динамического добавления поля
        function addInputField(value = '') {
            if (fieldCount >= MAX_FIELDS) return;

            fieldCount++;

            const div = document.createElement('div');
            div.className = 'word-field';
            div.id = `field-${fieldCount}`;

            const input = document.createElement('input');
            input.type = 'text';
            input.placeholder = `Слово или фраза ${fieldCount}`;
            input.value = value;
            input.addEventListener('input', validateAndCheckLimits);
            
            const removeBtn = document.createElement('button');
            removeBtn.className = 'remove-btn';
            removeBtn.textContent = 'Удалить';
            removeBtn.onclick = () => {
                inputContainer.removeChild(div);
                fieldCount--;
                validateAndCheckLimits();
            };

            div.appendChild(input);
            div.appendChild(removeBtn);
            inputContainer.appendChild(div);

            validateAndCheckLimits();
        }

        // 2. Функция для сбора всех непустых слов
        function gatherInputs() {
            const inputs = inputContainer.querySelectorAll('input[type="text"]');
            const words = [];
            inputs.forEach(input => {
                const trimmedValue = input.value.trim();
                if (trimmedValue) {
                    words.push(trimmedValue);
                }
            });
            return words;
        }

        // 3. Функция для валидации и проверки лимитов
        function validateAndCheckLimits() {
            const currentWords = gatherInputs();
            const currentFields = inputContainer.children.length;

            // Валидация
            if (currentWords.length === 0) {
                errorMessage.textContent = 'Добавьте хотя бы одно слово.';
                spinButton.disabled = true;
            } else {
                errorMessage.textContent = '';
                spinButton.disabled = false;
            }

            // Проверка лимита полей
            if (currentFields < MAX_FIELDS) {
                addInputBtn.disabled = false;
                addInputBtn.textContent = `+ Добавить Поле (Макс. ${MAX_FIELDS})`;
            } else {
                addInputBtn.disabled = true;
                addInputBtn.textContent = `Лимит полей (${MAX_FIELDS}) достигнут`;
            }

            // Перенумерация полей для порядка
            const allInputs = inputContainer.querySelectorAll('input[type="text"]');
            allInputs.forEach((input, index) => {
                input.placeholder = `Слово или фраза ${index + 1}`;
            });
            fieldCount = allInputs.length;
        }

        // 4. Основная логика: нажатие кнопки "Крутить"
        function handleSpin() {
            const words = gatherInputs();

            if (words.length === 0) {
                return;
            }

            // Выбираем случайное слово
            const randomIndex = Math.floor(Math.random() * words.length);
            const resultWord = words[randomIndex];

            // Шаг 1: Показать модалку с колесом
            wheelModal.style.display = 'flex';
            wheelElement.classList.add('spinning'); // Запуск анимации
            spinButton.disabled = true; // Блокируем кнопку на время прокрутки

            // Шаг 2: Имитация прокрутки (3 секунды)
            setTimeout(() => {
                // Остановка анимации
                wheelElement.classList.remove('spinning');
                
                // Скрыть модалку колеса
                wheelModal.style.display = 'none';

                // Шаг 3: Показать модалку результата
                resultDisplay.textContent = resultWord;
                resultModal.style.display = 'flex';

            }, 3000); // Анимация длится 3 секунды
        }

        // 5. Функция для закрытия модалки результата
        function closeResultModal() {
            resultModal.style.display = 'none';
            validateAndCheckLimits(); // Активируем кнопку "Крутить" снова
        }

        // 6. Инициализация и привязка событий
        addInputBtn.addEventListener('click', () => addInputField());
        spinButton.addEventListener('click', handleSpin);
        closeResultBtn.addEventListener('click', closeResultModal);

        // Добавляем два стартовых поля при загрузке
        addInputField('Вариант А');
        addInputField('Вариант Б');
        
        // Первая проверка при загрузке
        validateAndCheckLimits();
    </script>
</body>
</html>
